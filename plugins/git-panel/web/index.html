<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Git Panel · Codex</title><link rel="icon" type="image/svg+xml" sizes="any" href="/icon.svg"><link rel="stylesheet" href="/style.css"></head>
<body class="light preview-closed">
<header class="compact-toolbar"><img class="product-icon" src="/icon.svg" width="24" height="24" alt="Git Panel"><div class="repo-title"><strong id="repoName">连接仓库…</strong><span id="kind" hidden></span><span id="root" hidden></span></div><div class="branch-wrap"><button id="branch" class="branch-pill" aria-label="切换分支" aria-haspopup="menu" aria-expanded="false"></button><div id="branchMenu" class="theme-menu branch-menu" role="menu" hidden></div></div><select id="theme" aria-label="主题"><option value="light">浅色</option><option value="dark">深色</option><option value="auto">跟随系统</option></select></header>
<div id="warning" role="alert" hidden></div>
<main><aside><section class="changes"><div class="section-title"><strong>源代码管理</strong><button id="refresh" title="刷新状态" aria-label="刷新状态">↻</button></div><div class="compose"><label for="message">提交说明 <span>Ctrl ↵</span></label><textarea id="message" placeholder="这次更新了什么？" aria-label="提交说明" rows="2"></textarea><button id="commit" class="primary" disabled>Commit</button></div><div id="groups"></div></section><section class="history"><div class="section-title"><div class="history-heading"><span class="document-icon" aria-hidden="true">≡</span><strong>提交历史</strong></div><span class="eyebrow">RECENT</span></div><div class="tools"><button id="fetch" title="获取远端更新" disabled>获取</button><button id="pull" title="仅快进拉取" disabled>↓ 拉取</button><button id="push" title="推送到上游分支" disabled>↑ Push</button></div><div id="counts" class="muted"></div><div id="history"></div></section></aside><div id="divider" role="separator" aria-label="调整文件列表宽度" tabindex="0"></div><article><div class="diff-heading"><span class="document-icon" aria-hidden="true">≡</span><strong id="diffTitle">更改预览</strong><span id="diffType" class="badge">统一差异</span></div><div class="diff-caption"><span>更改详情</span><span><i class="legend-add"></i>新增 <i class="legend-del"></i>删除</span></div><div id="diff" class="diff"><div class="empty"><span>⑂</span><h2>从一处更改开始</h2><p>选择左侧文件，查看每一行差异。</p></div></div></article></main>
<footer role="status" aria-live="polite"><span id="status">正在读取仓库…</span><span id="lastFetch"></span></footer><script type="module" src="/app.js"></script></body></html>
