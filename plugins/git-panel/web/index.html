<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Git 面板</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="brand">⑂ <strong>Git 面板</strong><span class="version">MVP 0.1</span></div><select id="theme" aria-label="主题"><option value="dark">深色</option><option value="light">浅色</option><option value="auto">跟随系统</option></select></header>
<section class="repo"><div><strong id="repoName">连接仓库…</strong><span id="kind" class="badge"></span></div><div id="branch"></div><div id="root" class="path"></div></section>
<div id="warning" role="alert" hidden></div>
<main><aside><section class="changes"><div class="section-title"><strong>源代码管理</strong><button id="refresh" title="刷新状态" aria-label="刷新状态">↻</button></div><textarea id="message" placeholder="提交说明（Ctrl+Enter 提交）" aria-label="提交说明" rows="2"></textarea><button id="commit" class="primary">✓ 提交</button><div id="groups"></div></section><section class="history"><div class="section-title"><button id="toggleHistory" aria-expanded="true">⌄ 历史</button><div class="tools"><button id="fetch" title="获取远端更新">获取</button><button id="pull" title="仅快进拉取">↓ 拉取</button><button id="push" title="推送到上游分支">↑ 推送</button></div></div><div id="counts" class="muted"></div><div id="history"></div></section></aside><div id="divider" role="separator" aria-label="调整文件列表宽度" tabindex="0"></div><article><div class="diff-heading"><strong id="diffTitle">更改预览</strong><span id="diffType" class="badge">统一差异</span></div><div id="diff" class="diff"><div class="empty"><span>⑂</span><h2>选择一个文件</h2><p>查看差异，暂存更改，然后提交。</p></div></div></article></main>
<footer role="status" aria-live="polite"><span id="status">正在读取仓库…</span><span id="lastFetch"></span></footer><script type="module" src="/app.js"></script></body></html>
